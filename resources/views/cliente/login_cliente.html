{% extends "layout/layout_cliente.html" %}

{% block title %}Iniciar Sesión - Callejón 19{% endblock %}

{% block content %}
<div class="mt-4 bg-white dark:bg-slate-800 rounded-2xl shadow-md p-6">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Bienvenido</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Inicia sesión para realizar tus pedidos</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="emailInput">Correo electrónico</label>
            <div class="relative">
                <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="email" id="emailInput" name="email" required
                    class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 dark:text-white transition-colors"
                    placeholder="tu@email.com">
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="passwordInput">Contraseña</label>
            <div class="relative">
                <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="passwordInput" name="password" required
                    class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 dark:text-white transition-colors"
                    placeholder="••••••••">
            </div>
        </div>

        <button type="submit" id="loginButton" class="w-full bg-gradient-to-r from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition hover:-translate-y-0.5 flex justify-center items-center gap-2">
            <span class="btn-text">Iniciar Sesión</span>
            <i class="bi bi-arrow-right-circle"></i>
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/cliente/api_cliente.js') }}"></script>

<script>
    // Redirigir si ya hay sesión
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('access_token');
        if (token) {
            window.location.href = '/cliente/perfil';
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginButton');
        const btnText = btn.querySelector('.btn-text');
        const btnIcon = btn.querySelector('i');

        if (!email || !password) {
            showError('Por favor completa todos los campos');
            return;
        }

        // Estado de carga visual
        btn.disabled = true;
        btnText.textContent = 'Verificando...';
        btnIcon.className = 'bi bi-arrow-repeat animate-spin';

        // Petición usando nuestro wrapper
        const response = await APICliente.post('/api/v1/clientes/login', { email, password });

        if (response.success) {
            // Guardar tokens en localStorage
            localStorage.setItem('access_token', response.data.access_token);
            localStorage.setItem('refresh_token', response.data.refresh_token);
            
            showSuccess('¡Acceso correcto!');
            
            setTimeout(() => {
                window.location.href = '/cliente/menu';
            }, 1000);
        } else {
            showError(response.error || 'Credenciales incorrectas');
            btn.disabled = false;
            btnText.textContent = 'Iniciar Sesión';
            btnIcon.className = 'bi bi-arrow-right-circle';
        }
    });
</script>
{% endblock %}
