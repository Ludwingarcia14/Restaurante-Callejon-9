<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Callejón 19{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>window.tailwind && (tailwind.config = { darkMode: 'class' })</script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block extra_css %}{% endblock %}

    <style>
        /* Ajustes específicos para móvil */
        body { padding-bottom: 70px; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around;
            padding: 0.5rem 0; z-index: 50;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #6b7280; font-size: 0.75rem; text-decoration: none;
            padding: 0.25rem 1rem; border-radius: 0.5rem;
            transition: color 0.2s;
        }
        
        .bottom-nav-item i { font-size: 1.25rem; margin-bottom: 0.125rem; }
        .bottom-nav-item.active { color: var(--color-primary); }
        
        /* Dark mode overrides */
        html.dark .bottom-nav { background: #1e293b; border-color: #334155; }
        html.dark .bottom-nav-item { color: #94a3b8; }
        html.dark .bottom-nav-item.active { color: var(--color-primary); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 min-h-screen">

    <header class="bg-white border-b sticky top-0 z-40 shadow-sm dark:bg-slate-800 dark:border-slate-700">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-2">
                <img src="{{ url_for('static', filename='img/callejon9.jpeg') }}" alt="Logo" class="w-8 h-8 rounded-full">
                <h1 class="text-lg font-bold text-gray-800 dark:text-white">Callejón 19</h1>
            </div>
            <div>
                <button onclick="toggleTheme()" class="p-2 rounded-lg text-gray-600 dark:text-gray-300">
                    <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav" id="bottomNav">
        <a href="{{ url_for('routes.cliente_menu_view') }}" class="bottom-nav-item" id="nav-menu">
            <i class="bi bi-journal-text"></i>
            <span>Menú</span>
        </a>
        <a href="{{ url_for('routes.cliente_carrito_view') }}" class="bottom-nav-item hidden relative" id="nav-carrito">
            <i class="bi bi-cart3"></i>
            <span id="carrito-badge" class="hidden absolute -top-1 right-2 bg-orange-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
            <span>Carrito</span>
        </a>
        <a href="{{ url_for('routes.cliente_pedido_activo_view') }}" class="bottom-nav-item hidden" id="nav-pedido">
            <i class="bi bi-receipt"></i>
            <span>Mi Pedido</span>
        </a>
        <a href="{{ url_for('routes.cliente_mis_pedidos_view') }}" class="bottom-nav-item hidden" id="nav-historial">
            <i class="bi bi-clock-history"></i>
            <span>Mis Pedidos</span>
        </a>
        <a href="{{ url_for('routes.cliente_perfil_view') }}" class="bottom-nav-item hidden" id="nav-perfil">
            <i class="bi bi-person"></i>
            <span>Perfil</span>
        </a>
        <a href="{{ url_for('routes.cliente_login_view') }}" class="bottom-nav-item" id="nav-login">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Entrar</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cliente/api_cliente.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cliente/carrito.js') }}"></script>
    <script>
        // Tema oscuro
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        }

        (function() {
            const isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) document.documentElement.classList.add('dark');
            window.addEventListener('DOMContentLoaded', () => updateThemeIcon(isDark));
        })();

        // Control de UI según la sesión
        document.addEventListener('DOMContentLoaded', function() {
            // Marcar enlace activo
            const currentPath = window.location.pathname;
            document.querySelectorAll('.bottom-nav-item').forEach(link => {
                const href = link.getAttribute('href');
                if (href && currentPath.includes(href)) link.classList.add('active');
            });

            // Verificar si hay token para mostrar/ocultar botones
            // (access_token se guarda "en crudo", no con saveToStorage/JSON.stringify)
            const token = localStorage.getItem('access_token');
            if (token) {
                document.getElementById('nav-login')?.classList.add('hidden');
                document.getElementById('nav-perfil')?.classList.remove('hidden');
                document.getElementById('nav-carrito')?.classList.remove('hidden');
                document.getElementById('nav-pedido')?.classList.remove('hidden');
                document.getElementById('nav-historial')?.classList.remove('hidden');
            }

            // Badge del carrito (carrito.js lo mantiene actualizado si está cargado)
            if (typeof Carrito !== 'undefined') {
                Carrito.actualizarBadge();
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
