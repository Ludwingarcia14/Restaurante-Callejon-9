{% extends "layout/layout_base.html" %}

{% block extra_css %}
<style>
    /* ── Color activo naranja para cocina ── */
    .nav-link.active {
        background: #fff7ed;
        color: #ea580c;
        border-right: 3px solid #ea580c;
    }

    /* ── Helpers de tarjetas para vistas de cocina ── */
    .card        { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07); overflow: hidden; }
    .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid #f3f4f6; background: #f9fafb; }
    .card-title  { font-size: 1.1rem; font-weight: 600; color: #1f2937; display: flex; align-items: center; gap: 0.5rem; }
    .card-body   { padding: 1.5rem; }

    .btn-kitchen {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1.25rem;
        background: #ea580c;
        color: white;
        border: none;
        border-radius: 0.5rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-kitchen:hover { background: #c2410c; }
</style>
{% endblock %}
