<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido no encontrado — Callejón 9</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f9fafb; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: white; border-radius: 24px; padding: 40px 32px; text-align: center;
                box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 360px; width: 100%; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        p  { font-size: 14px; color: #6b7280; line-height: 1.6; }
        .folio { display: inline-block; margin-top: 12px; background: #f3f4f6; border-radius: 8px;
                 padding: 6px 14px; font-family: monospace; font-size: 13px; color: #374151; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📦</div>
        <h1>Pedido no encontrado</h1>
        <p>No encontramos un pedido con el folio:</p>
        <div class="folio">{{ folio }}</div>
        <p style="margin-top:16px;">Verifica el enlace que te compartieron o comunícate con el restaurante.</p>
    </div>
</body>
</html>
